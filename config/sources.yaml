# Data sources for the NFL beer sheet.
#
# ESPN projections are the stat backbone (rescored to half-PPR).
# Rotoballer and Yahoo supply market ranks for edge-vs-board columns.

sources:
  - id: espn_projections
    kind: espn_projections
    weight: 1.0
    description: ESPN season stat projections (public API, rescore to half-PPR)

  - id: rotoballer
    kind: rotoballer_ranking
    url: https://www.rotoballer.com/top-400-updated-half-ppr-fantasy-football-rankings-2026/1910000
    weight: 1.0
    description: Rotoballer top-400 half-PPR rankings

  - id: yahoo
    kind: yahoo_ranking
    url: https://sports.yahoo.com/fantasy/article/fantasy-football-rankings-consensus-top-300-players-160643696.html
    weight: 0.8
    description: Yahoo consensus top-300 (PDF at data/manual/yahoo_top300.pdf)

  - id: subvertadown
    kind: subvertadown_csv
    path: data/manual/subvertadown_beersheet.csv
    weight: 0.0
    description: Subvertadown BeerSheet (reference VAL/ADP — not blended into VBD)

news:
  - id: fantasyfootball
    kind: reddit_rss
    url: https://www.reddit.com/r/fantasyfootball/.rss
    limit: 40
